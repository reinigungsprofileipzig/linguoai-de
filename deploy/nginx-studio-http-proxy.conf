# studio.linguoai.de: Cloudflare HTTPS -> HTTP origin -> loopback API.
# Load this file in Nginx's http context (Debian sites-enabled already is).
# Cloudflare SSL mode and DNS proxy state are operator-owned and unchanged.
# This template needs ngx_http_realip_module (included by Debian Nginx).
# Cloudflare ranges verified 2026-10-14:
# https://www.cloudflare.com/ips-v4/ and https://www.cloudflare.com/ips-v6/
# Review the published lists before installation and whenever they change.

# Check the original TCP peer, before real_ip_header replaces $remote_addr.
# A direct client cannot gain trust by supplying a CF-Connecting-IP header.
geo $realip_remote_addr $linguoai_studio_peer {
    default 0;
    127.0.0.1/32 2;
    ::1/128 2;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

map "$linguoai_studio_peer:$http_x_forwarded_proto" $linguoai_studio_scheme {
    default http;
    "1:https" https;
    # Local loopback diagnostics may supply the public scheme explicitly.
    "2:https" https;
}

map "$linguoai_studio_peer:$http_x_forwarded_proto" $linguoai_studio_edge_http {
    default 0;
    "1:http" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name studio.linguoai.de;

    # Restore the browser IP only when the socket peer is Cloudflare.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    # Preserve loopback diagnostics; deny all other direct-origin clients.
    # A return-only if is safe and runs before request-body processing.
    if ($linguoai_studio_peer = 0) { return 403; }
    # Redirect only when Cloudflare reports an HTTP browser connection.
    # HTTPS browser requests arrive here over HTTP too and must not redirect.
    if ($linguoai_studio_edge_http = 1) { return 308 https://studio.linguoai.de$request_uri; }

    # Legacy browser requests: 100 MiB plus multipart overhead.
    # The API authenticates and independently enforces transfer/metadata limits.
    client_max_body_size 101m;
    client_body_timeout 300s;
    send_timeout 300s;

    proxy_http_version 1.1;
    proxy_set_header Host studio.linguoai.de;
    proxy_set_header X-Real-IP $remote_addr;
    # Replace incoming forwarded headers instead of retaining a spoofed chain.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $linguoai_studio_scheme;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Browser and remote-worker PUT bodies contain only raw bytes, at most 8 MiB.
    # offsets are query parameters; SHA-256 is sent in X-Chunk-SHA256.
    # Creation and completion use separate small JSON endpoints.
    location ~ ^/api/(uploads/[A-Za-z0-9_-]+|worker/jobs/[A-Za-z0-9_-]+/uploads/[A-Za-z0-9_-]+)$ {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:8765;
    }

    # Retain authenticated legacy worker uploads for loopback compatibility.
    # Remote bots use small chunks rather than sending a large single request.
    location ~ ^/api/worker/jobs/[A-Za-z0-9_-]+/artifacts/(video|original_srt|translated_srt)$ {
        client_max_body_size 1025m;
        proxy_pass http://127.0.0.1:8765;
    }

    location / {
        # No origin HTTP -> HTTPS redirect: Flexible would create a loop.
        # No URI suffix: keep /assets and /api unchanged at the domain root.
        proxy_pass http://127.0.0.1:8765;
    }
}
