# Cloudflare-proxied domain-root variant for studio.linguoai.de.
# This replaces nginx-studio.conf; do not enable both vhosts.
# Keep the DNS record proxied (orange cloud) and use Full (strict), never Flexible.
# Cloudflare Origin CA is for Cloudflare-to-origin TLS, not direct browser trust.
# Origin CA requires neither Let's Encrypt nor an HTTP ACME challenge.
#
# ACTIVATION GATE FOR THIS ENTIRE FILE:
# Enable BOTH the HTTP redirect and HTTPS server only after these files exist,
# the signed certificate covers studio.linguoai.de, and certificate/key match:
#   /etc/nginx/linguoai-origin/studio.linguoai.de.pem
#   /etc/nginx/linguoai-origin/studio.linguoai.de.key
# Before that gate passes, keep the existing site active; any temporary studio HTTP
# bootstrap vhost should return 503 rather than redirect to an unavailable HTTPS origin.
# After issuance: nginx -t, activate/reload, verify origin TLS, then use Full (strict).
# Signing the CSR and changing Cloudflare settings are separate operator actions.
#
# Application public_url: https://studio.linguoai.de (empty Uvicorn root_path).
# API and same-host worker: http://127.0.0.1:8765.
# Current API file limits stay at 100 MiB input / 1 GiB result:
#   max_upload_bytes: 104857600
#   max_result_bytes: 1073741824
#
# UNSOLVED EDGE LIMIT: Free/Pro Cloudflare requests are limited to 100 MB.
# A 100 MiB browser file plus multipart overhead and a 1 GiB remote-worker result
# upload exceed that unchunked request limit. Larger Nginx limits DO NOT fix it.
# This template implements no application-level upload chunking or edge-limit change.
# The same-host worker's loopback uploads do not traverse Cloudflare.
# References:
# https://developers.cloudflare.com/ssl/origin-configuration/origin-ca/
# https://developers.cloudflare.com/ssl/origin-configuration/ssl-modes/full-strict/
# https://developers.cloudflare.com/support/troubleshooting/http-status-codes/4xx-client-error/error-413/

# HTTP REDIRECT GATE: load this server only together with the ready HTTPS server below.
server {
    listen 80;
    listen [::]:80;
    server_name studio.linguoai.de;

    location / {
        return 308 https://studio.linguoai.de$request_uri;
    }
}

# ORIGIN CA CERTIFICATE GATE: both signed certificate and existing key must be ready.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name studio.linguoai.de;

    ssl_certificate /etc/nginx/linguoai-origin/studio.linguoai.de.pem;
    ssl_certificate_key /etc/nginx/linguoai-origin/studio.linguoai.de.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LinguoAIStudioOriginTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # These are ORIGIN limits, independent of the smaller Cloudflare edge limit.
    client_max_body_size 101m;
    client_body_timeout 300s;
    send_timeout 300s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location ~ ^/api/worker/jobs/[A-Za-z0-9_-]+/artifacts/(video|original_srt|translated_srt)$ {
        # 1 GiB plus multipart overhead; public unchunked uploads still hit the edge cap.
        client_max_body_size 1025m;
        proxy_pass http://127.0.0.1:8765;
    }

    location / {
        # Keep /assets and /api at the domain root without URI rewriting.
        proxy_pass http://127.0.0.1:8765;
    }
}