# Domain-root template for studio.linguoai.de.
# DNS and certificate issuance are separate operator actions; this file does not perform them.
# Bootstrap: load only the HTTP server until both certificate files below exist.
# ACME webroot: /var/lib/linguoai-acme (including its .well-known/acme-challenge directory).
# After issuance: enable the HTTPS server, run nginx -t, then reload Nginx.
# Application public_url: https://studio.linguoai.de (empty Uvicorn root_path).
# Keep the API and local worker on http://127.0.0.1:8765.
#
# Required server.json limits:
#   max_upload_bytes: 104857600   (100 MiB)
#   max_result_bytes: 1073741824  (1 GiB)
# Proxy limits below add room for multipart headers; the API enforces actual file sizes.

server {
    listen 80;
    listen [::]:80;
    server_name studio.linguoai.de;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/linguoai-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://studio.linguoai.de$request_uri;
    }
}

# CERTIFICATE GATE: do not load this HTTPS block until both paths exist.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name studio.linguoai.de;

    ssl_certificate /etc/letsencrypt/live/studio.linguoai.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.linguoai.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LinguoAIStudioTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Ordinary browser uploads: 100 MiB plus multipart overhead.
    client_max_body_size 101m;
    client_body_timeout 300s;
    send_timeout 300s;

    # Inherited by both proxy locations; stream files instead of making extra disk copies.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Authenticated worker results: 1 GiB plus multipart overhead.
    # API authentication, lease ownership and file-size checks still apply.
    location ~ ^/api/worker/jobs/[A-Za-z0-9_-]+/artifacts/(video|original_srt|translated_srt)$ {
        client_max_body_size 1025m;
        proxy_pass http://127.0.0.1:8765;
    }

    location / {
        # No URI suffix: keep /assets and /api unchanged at the domain root.
        proxy_pass http://127.0.0.1:8765;
    }
}

