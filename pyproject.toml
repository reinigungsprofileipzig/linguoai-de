[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "linguoai"
version = "2.2.1"
description = "Robuste Video-Transkription, Uebersetzung und Sprachsynchronisation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "LinguoAI" }]
dependencies = [
    "deepl>=1.22,<2",
    "deep-translator>=1.11.4,<2",
    "edge-tts>=7.2,<8",
    "faster-whisper>=1.1.0,<2",
    "gTTS>=2.5.4,<3",
]

[project.optional-dependencies]
parakeet = ["sherpa-onnx>=1.12.11,<2", "numpy>=1.26,<3"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "python-multipart>=0.0.18,<1"]
drive = ["google-api-python-client>=2.150,<3", "google-auth>=2.35,<3", "google-auth-oauthlib>=1.2,<2", "google-auth-httplib2>=0.2,<1", "httplib2>=0.22,<1"]
gemini = ["google-genai>=2,<3"]
gui = ["ttkbootstrap>=1.10,<2"]
piper = ["piper-tts>=1.5.0,<1.6.0"]
voice-clone = ["chatterbox-tts==0.1.7"]
local = [
    "accelerate>=1,<2",
    "sentencepiece>=0.2,<1",
    "torch>=2.6,<3",
    "transformers>=5,<6",
]
desktop = [
    "accelerate>=1,<2",
    "sentencepiece>=0.2,<1",
    "torch>=2.6,<3",
    "transformers>=5,<6",
    "ttkbootstrap>=1.10,<2",
]
colab = [
    "accelerate>=1,<2",
    "google-genai>=2,<3",
    "gradio>=5.49,<7",
    "sentencepiece>=0.2,<1",
    "torch>=2.6,<3",
    "transformers>=5,<6",
]
all = [
    "accelerate>=1,<2",
    "google-genai>=2,<3",
    "gradio>=5.49,<7",
    "sentencepiece>=0.2,<1",
    "torch>=2.6,<3",
    "transformers>=5,<6",
    "ttkbootstrap>=1.10,<2",
]
dev = [
    "beautifulsoup4>=4.13,<5",
    "build>=1.2,<2",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
linguoai = "linguoai.cli:entrypoint"
linguoai-colab = "linguoai.colab_ui:entrypoint"
linguoai-web = "linguoai.web_api:entrypoint"
linguoai-worker = "linguoai.web_worker:entrypoint"

[project.gui-scripts]
linguoai-gui = "linguoai.cli:gui_entrypoint"

[tool.setuptools.packages.find]
include = ["linguoai*"]

[tool.setuptools.data-files]
"share/linguoai-web" = ["web.html"]
"share/linguoai-web/assets" = ["assets/simple.css", "assets/web-app.css", "assets/web-app.js", "assets/favicon.svg", "assets/logo-mark.svg"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_site_i18n.py" = ["RUF001"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
